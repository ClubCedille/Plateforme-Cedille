name: Render club configuration

on:
  pull_request:
    paths:
      - "clubs/**"
      - "scripts/**"
      - ".github/workflows/render-club-configs.yml"
  push:
    branches:
      - main
    paths:
      - "clubs/**"
      - "scripts/**"
      - ".github/workflows/render-club-configs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/render_club_configs.py --check

  render:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt

      - name: Check out k8s-shared
        uses: actions/checkout@v4
        with:
          repository: ClubCedille/k8s-shared
          token: ${{ secrets.K8S_SHARED_TOKEN }}
          path: k8s-shared

      - name: Render club configuration
        run: python scripts/render_club_configs.py --k8s-shared k8s-shared

      - name: Create pull request
        uses: peter-evans/create-pull-request@v5
        with:
          path: k8s-shared
          token: ${{ secrets.K8S_SHARED_TOKEN }}
          branch: chore/render-club-configs
          delete-branch: true
          title: "chore(clubs): render club configuration from Plateforme-Cedille"
          commit-message: "chore(clubs): render club configuration"
          body: |
            Generated from `ClubCedille/Plateforme-Cedille` `clubs/*.yaml`.

            This updates:
            - `data/clubs.yaml`
            - `data/authentik-extra-groups.yaml`
            - the Forgejo `groupTeamMap` in `apps/forgejo/base/forgejo.values.yaml`

            Do not edit the generated files directly. Change the club files in
            `Plateforme-Cedille` and rerun the render workflow.
